<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="css/style.css" />
		<title>Passenger Counter</title>
	</head>
	<body>
		<main class="counter-card">
			<h1 class="counter-title">Passenger Counter</h1>

			<div class="counter-display">
				<span class="count-label">Passengers:</span>
				<span class="count-value" id="count-value">0</span>
			</div>

			<div class="button-group">
				<button type="button" class="btn btn-success" id="btn-add">Add</button>
				<button type="button" class="btn btn-dark" id="btn-reset">Reset</button>
			</div>
		</main>

		<script src="js/script.js"></script>
	</body>
</html>
